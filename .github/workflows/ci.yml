name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://remnote:remnote@localhost:5432/remnote_mcp
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remnote
          POSTGRES_PASSWORD: remnote
          POSTGRES_DB: remnote_mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remnote -d remnote_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix server --omit=dev --audit-level=high

      - name: Check TypeScript
        run: npm run check-types -- --noEmit

      - name: Run plugin and shared regression suite
        run: npm test

      - name: Validate and build RemNote plugin
        run: |
          npm run validate
          npm run build

      - name: Build MCP server
        run: npm run server:build

      - name: Run server release-critical checks
        run: |
          npm run server:test:security
          npm run server:test:tool-schemas
          npm run server:test:bulk-storage
          npm run server:test:idempotency
          npm run server:test:health-check-routing
          npm run server:smoke
